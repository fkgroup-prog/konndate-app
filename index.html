<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日の献立">
<meta name="theme-color" content="#FAFAF8">
<title>今日の献立</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Noto Sans JP', 'YuGothic', sans-serif; background: #FAFAF8; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 14px 40px; }
  .subtitle { font-size: 12px; color: #999; letter-spacing: 0.05em; margin-bottom: 6px; }
  .date-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .nav-btn { background: white; border: 1px solid #E0E0E0; border-radius: 8px; width: 38px; height: 38px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #444; flex-shrink: 0; }
  .nav-btn:active { background: #F5F5F5; }
  .date-label { flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: #1A1A1A; }
  .tool-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
  .meals { display: flex; flex-direction: column; gap: 12px; }
  .meal-card { background: white; border-radius: 14px; border: 1px solid #EBEBEB; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .accent-bar { height: 4px; }
  .card-body { padding: 14px 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .meal-type-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
  .tool-tag { font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 700; }
  .meal-name { font-size: 16px; font-weight: 700; color: #1A1A1A; margin-bottom: 4px; }
  .meal-desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 10px; }
  .steps-btn { width: 100%; border: none; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
  .steps-btn:active { opacity: 0.7; }
  .steps { margin-top: 10px; }
  .step { padding: 10px 0; border-top: 1px solid #F0F0F0; }
  .step:first-child { border-top: none; }
  .step-header { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 4px; }
  .step-num { min-width: 22px; height: 22px; border-radius: 50%; color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-title { font-size: 13px; font-weight: 700; color: #1A1A1A; line-height: 1.5; }
  .step-detail { font-size: 12px; color: #555; line-height: 1.6; margin-left: 32px; }
  .ingredients-box { background: #F8F8F6; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .ingredients-title { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 6px; letter-spacing: 0.05em; }
  .ingredient-row { display: flex; justify-content: space-between; font-size: 12px; color: #444; padding: 3px 0; border-bottom: 1px solid #EFEFEF; }
  .ingredient-row:last-child { border-bottom: none; }
  .ingredient-name { color: #333; }
  .ingredient-amount { color: #666; font-weight: 600; }
  .mode-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; background: #FFF3E0; color: #E65100; font-weight: 700; margin-left: 6px; }
  .tip-box { margin-top: 14px; background: #FFFBF0; border: 1px solid #FFE082; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #5D4037; line-height: 1.6; }
  .tip-title { font-weight: 700; color: #E65100; }
  .regen-btn { margin-top: 14px; width: 100%; padding: 14px; font-size: 14px; font-weight: 700; color: #333; background: white; border: 1px solid #DCDCDC; border-radius: 12px; cursor: pointer; }
  .regen-btn:active { background: #F5F5F5; }
  .footer { margin-top: 12px; text-align: center; font-size: 11px; color: #BBB; }
</style>
</head>
<body>
<div class="app">
  <div class="subtitle">今日の献立</div>
  <div class="date-nav">
    <button class="nav-btn" onclick="changeDay(-1)">‹</button>
    <div class="date-label" id="date-label"></div>
    <button class="nav-btn" onclick="changeDay(1)">›</button>
  </div>
  <div class="tool-badges">
    <span class="badge" style="background:#E3F2FD;color:#1565C0">🔥 ヘルシオ</span>
    <span class="badge" style="background:#E8F5E9;color:#1B5E20">🍲 ホットクック</span>
    <span class="badge" style="background:#FFF3E0;color:#E65100">🥤 ボンヌ</span>
  </div>
  <div class="meals" id="meals"></div>
  <div class="tip-box" id="tip-box"></div>
  <button class="regen-btn" onclick="randomize()">🔄 別の献立にする</button>
  <div class="footer">1〜2人前 ・ 簡単レシピ</div>
</div>

let offset=0, randOff=0, expanded={}, useExtra=false, extraSlot="";

function getDateLabel(off){
  const d=new Date(); d.setDate(d.getDate()+off);
  const m=d.getMonth()+1,day=d.getDate(),wd=WEEKDAYS[d.getDay()];
  if(off===0) return `今日 ${m}/${day}（${wd}）`;
  if(off===1) return `明日 ${m}/${day}（${wd}）`;
  if(off===-1) return `昨日 ${m}/${day}（${wd}）`;
  return `${m}/${day}（${wd}）`;
}

function render(){

  const dayIdx=(today.getDay()+randOff+700)%7;
  const baseMenu=menus[dayIdx];
  // extraレシピを差し込む場合は該当スロットだけ置き換え
  const menu = useExtra && extraSlot ? {
    ...baseMenu,
    [extraSlot]: extraRecipes[extraSlot][0]
  } : baseMenu;
  document.getElementById("date-label").textContent=getDateLabel(offset);

  const mealsEl=document.getElementById("meals");
  mealsEl.innerHTML=MEAL_ORDER.map(key=>{
    const meal=menu[key];
    const tool=TOOL_CONFIG[meal.tool];

            <span class="ingredient-amount">${i.amount}</span>

    const stepsHtml=`
      <div class="steps">
        ${meal.steps.map((s,i)=>`
          <div class="step">
            <div class="step-header">
              <span class="step-num" style="background:${mc.accent}">${i+1}</span>

            <div class="step-detail">${s.detail}</div>
          </div>`).join("")}

    return `
      <div class="meal-card">
        <div class="accent-bar" style="background:${mc.accent}"></div>
        <div class="card-body">
          <div class="card-header">
            <span class="meal-type-label" style="color:${mc.accent}">${MEAL_LABELS[key]}</span>

          <div class="meal-name">${meal.name}</div>
          <div class="meal-desc">${meal.desc}</div>
          <button class="steps-btn" style="background:${mc.light};color:${mc.accent}" onclick="toggleStep('${key}')">
            ${isOpen?"▲ 閉じる":"▼ 材料・手順を見る"}
          </button>
          ${isOpen ? ingredientsHtml + stepsHtml : ""}
        </div>
      </div>`;
  }).join("");

  document.getElementById("tip-box").innerHTML=
    `<span class="tip-title">💡 今日のコツ</span><br>${menu.tip}`;
}

function changeDay(d){ offset+=d; expanded={}; useExtra=false; render(); }
function randomize(){
  // 通常メニュー7パターン＋追加レシピ（昼or夕）をローテーション
  const total = 7 + 2; // 7曜日 + きのこリゾット昼 + きのこリゾット夕
  const current = randOff % total;
  const next = (current + 1) % total;
  if(next < 7){
    randOff = next; useExtra=false; extraSlot="";
  } else if(next === 7){
    useExtra=true; extraSlot="lunch"; randOff=(randOff+1)%7;
  } else {
    useExtra=true; extraSlot="dinner"; randOff=(randOff+1)%7;
  }
  randOff=(randOff+1)%7;
  expanded={};
  render();
}
function toggleStep(key){ expanded[key]=!expanded[key]; render(); }

render();
</script>
</body>
</html>
